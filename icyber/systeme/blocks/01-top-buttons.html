<!-- iCyber · Top buttons (Main Page · Amazon · Tools · All journeys · Dark/White mode) · put this FIRST on the page · paste into a systeme.io "Custom HTML/CSS/JS" element -->
<div id="lj-shoptop">
<style>
#lj-shoptop{--bg:#EDF3F2;--card:#ffffff;--cardbd:#E3ECEB;--ink:#3c4f50;--head:#0F4C4C;--mut:#64777a;--turq:#1A9E9E;--turqbr:#35B7B7;--green:#1B4D36;--mag:#8E1F45;--magdk:#5E1530;--soft:#F6F9F9;--hl:#F7E6EE;
  font-family:"Avenir Next","Segoe UI","Helvetica Neue",-apple-system,Arial,sans-serif;-webkit-font-smoothing:antialiased;
  max-width:900px;margin:0 auto;padding:0 2px;color:var(--ink);line-height:1.5;text-align:left;}
html[data-theme="dark"] #lj-shoptop{--bg:#0e1621;--card:#16202c;--cardbd:#273543;--ink:#c6d5d5;--head:#ffffff;--mut:#93a6a6;--soft:#1c2836;--hl:#2a1d27;--magtxt:#E0577F;}
#lj-shoptop *,#lj-shoptop *::before,#lj-shoptop *::after{box-sizing:border-box;margin:0;padding:0;border:0;background:none;box-shadow:none;text-shadow:none;letter-spacing:normal;text-transform:none;list-style:none;}
#lj-shoptop a{text-decoration:none;}
#lj-shoptop{container-type:inline-size;width:100%;box-sizing:border-box;}
#lj-shoptop .lj-topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:900px;margin:0 auto;width:100%;padding:18px 10px 0;}
#lj-shoptop .lj-back,#lj-shoptop .lj-amazon,#lj-shoptop .lj-free,#lj-shoptop .welcome-pill,#lj-shoptop .themebtn{display:inline-flex;align-items:center;justify-content:center;width:152px;height:29px;padding:0 8px;border-radius:15px;
  font:800 10px/1 "Avenir Next",Arial;letter-spacing:.3px;white-space:nowrap;cursor:pointer;
  transition:transform .22s cubic-bezier(.2,.75,.25,1),box-shadow .22s ease,filter .15s;}
#lj-shoptop .lj-back{color:var(--head);background:var(--card);border:1.5px solid var(--cardbd);box-shadow:0 6px 16px rgba(0,0,0,.14);}
#lj-shoptop .lj-amazon{color:#131A22;background:linear-gradient(135deg,#FEBD69,#FF9900);border:1.5px solid #E88A00;box-shadow:0 6px 16px rgba(0,0,0,.20);}
html[data-theme="dark"] #lj-shoptop .lj-amazon{color:#ffffff;}
#lj-shoptop .lj-free{color:#fff;background:linear-gradient(135deg,#245F46,#0F3324);border:1.5px solid #0F3324;box-shadow:0 6px 16px rgba(15,51,36,.30);}
#lj-shoptop .welcome-pill{color:#fff;letter-spacing:1.4px;text-transform:uppercase;background:linear-gradient(135deg,#8E1F45,#5E1530);box-shadow:0 6px 16px rgba(94,21,48,.28);}
#lj-shoptop .themebtn{color:var(--head);background:var(--card);border:1.5px solid var(--cardbd);box-shadow:0 6px 18px rgba(0,0,0,.18);}
#lj-shoptop .themebtn .tb-ic{margin-right:5px;line-height:1;}
#lj-shoptop .lj-back:hover,#lj-shoptop .lj-amazon:hover,#lj-shoptop .lj-free:hover,#lj-shoptop .welcome-pill:hover,#lj-shoptop .themebtn:hover{transform:translateY(-3px) scale(1.04);filter:brightness(1.05);}
#lj-shoptop .lbl-short{display:none;}
@container (max-width:640px){#lj-shoptop .lj-topbar{gap:6px;padding:14px 0 0;}
  #lj-shoptop .lj-back,#lj-shoptop .lj-amazon,#lj-shoptop .lj-free,#lj-shoptop .welcome-pill,#lj-shoptop .themebtn{width:auto;flex:1 1 0;min-width:0;padding:0 4px;font-size:10px;}
  #lj-shoptop .lbl-full{display:none;}#lj-shoptop .lbl-short{display:inline;}}
@container (max-width:460px){
 #lj-shoptop .lj-topbar{gap:4px;}
 #lj-shoptop .lj-back,#lj-shoptop .lj-amazon,#lj-shoptop .lj-free,#lj-shoptop .welcome-pill,#lj-shoptop .themebtn{padding:0 3px;font-size:9px;letter-spacing:0;height:27px;}
 #lj-shoptop .welcome-pill{letter-spacing:.4px;} #lj-shoptop .themebtn .tb-ic{margin-right:2px;}
}
</style>
<div class="lj-topbar">
  <a class="lj-back" href="https://www.cybercnslt.com/" target="_top" data-ljnav="1"><span class="lbl-full">Main Page</span><span class="lbl-short">Home</span></a>
  <a class="lj-amazon" href="https://amzn.to/3QzHB0n" target="_blank" rel="noopener nofollow">&#128722;&nbsp;<span class="lbl-full">My Amazon Store</span><span class="lbl-short">Amazon</span></a>
  <a class="lj-free" href="https://www.cybercnslt.com/#tools" target="_top" data-ljnav="1"><span class="lbl-full">Tools and Resources</span><span class="lbl-short">Tools</span></a>
  <a class="welcome-pill" href="https://www.cybercnslt.com/#journeys" target="_top" data-ljnav="1"><span class="lbl-full">All journeys</span><span class="lbl-short">Journeys</span></a>
  <button class="themebtn" type="button" onclick="toggleTheme()" title="Dark Mode / White Mode" aria-label="Switch dark or white mode"><span class="tb-ic">&#127769;</span><span class="lbl-full">Dark Mode</span><span class="lbl-short">Dark</span></button>
</div>
</div>
<script>
/* Light / dark mode switch. The page always opens in white mode; dark mode only lasts for the current visit */
(function(){
  var r=document.documentElement;
  r.removeAttribute('data-theme');
  try{ localStorage.removeItem('lj-theme'); }catch(e){}
  if(!document.getElementById('lj-pagebg')){
    var s=document.createElement('style');s.id='lj-pagebg';
    s.textContent='html,body{background:#EDF3F2 !important;transition:background .3s ease;}html[data-theme="dark"],html[data-theme="dark"] body{background:#0e1621 !important;}';
    document.head.appendChild(s);
  }
  window.ljLabel=function(){
    var dark=r.getAttribute('data-theme')==='dark';
    document.querySelectorAll('.themebtn').forEach(function(b){
      b.innerHTML=dark?'<span class="tb-ic">&#9728;&#65039;</span><span class="lbl-full">White Mode</span><span class="lbl-short">White</span>'
                      :'<span class="tb-ic">&#127769;</span><span class="lbl-full">Dark Mode</span><span class="lbl-short">Dark</span>';
    });
  };
  window.toggleTheme=function(){
    if(r.getAttribute('data-theme')==='dark'){r.removeAttribute('data-theme');}
    else{r.setAttribute('data-theme','dark');}
    window.ljLabel();
  };
  window.ljLabel();
  document.addEventListener('DOMContentLoaded',window.ljLabel);
  window.addEventListener('load',window.ljLabel);
})();
/* Website links: same-page journeys/tools links switch the view instead of doing nothing */
(function(){
  if(window.ljNavReady) return; window.ljNavReady=true;
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('a[data-ljnav]'):null;
    if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button) return;
    var href=a.getAttribute('href')||'', u; try{u=new URL(href,location.href);}catch(x){return;}
    var w=window; try{ if(window.top!==window && window.top.location.host) w=window.top; }catch(x){ w=null; }
    if(!w){ e.preventDefault(); try{window.open(href,'_top');}catch(x){location.href=href;} return; }
    var same=w.location.host.replace(/^www\./,'')===u.host.replace(/^www\./,'') && w.location.pathname===u.pathname;
    e.preventDefault();
    if(same && u.hash){
      if(w.location.hash===u.hash){ try{w.dispatchEvent(new HashChangeEvent('hashchange'));}catch(x){} }
      else { w.location.hash=u.hash; }
      try{ w.scrollTo(0,0); }catch(x){}
    } else { w.location.href=u.href; }
  },true);
})();
</script>
