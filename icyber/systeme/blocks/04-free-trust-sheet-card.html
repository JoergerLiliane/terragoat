<!-- iCyber · Free TRUST Sheet – Financial Tracker card · paste into a systeme.io "Custom HTML/CSS/JS" element -->
<div id="lj-freecard">
<style>
#lj-freecard{--bg:#EDF3F2;--card:#ffffff;--cardbd:#E3ECEB;--ink:#3c4f50;--head:#0F4C4C;--mut:#64777a;--turq:#1A9E9E;--turqbr:#35B7B7;--green:#1B4D36;--mag:#8E1F45;--magdk:#5E1530;--soft:#F6F9F9;--hl:#F7E6EE;
  font-family:"Avenir Next","Segoe UI","Helvetica Neue",-apple-system,Arial,sans-serif;-webkit-font-smoothing:antialiased;
  max-width:440px;margin:0 auto;padding:0 2px;color:var(--ink);line-height:1.5;text-align:left;}
html[data-theme="dark"] #lj-freecard{--bg:#0e1621;--card:#16202c;--cardbd:#273543;--ink:#c6d5d5;--head:#ffffff;--mut:#93a6a6;--soft:#1c2836;--hl:#2a1d27;--magtxt:#E0577F;}
#lj-freecard *,#lj-freecard *::before,#lj-freecard *::after{box-sizing:border-box;margin:0;padding:0;border:0;background:none;box-shadow:none;text-shadow:none;letter-spacing:normal;text-transform:none;list-style:none;}
#lj-freecard a{text-decoration:none;}
#lj-freecard .stop{background:var(--card);border:1px solid var(--cardbd);border-top:4px solid var(--turq);border-radius:18px;padding:24px 26px;box-shadow:0 8px 22px rgba(10,20,25,.08);}
#lj-freecard .stop-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
#lj-freecard .stop-ic{font-size:28px;line-height:1;}
#lj-freecard .stop-badge{display:inline-block;font:800 10.5px/1 "Avenir Next",Arial;letter-spacing:1px;text-transform:uppercase;padding:6px 12px;border-radius:20px;}
#lj-freecard .stop-badge.paid{color:var(--magtxt,var(--mag));border:1.5px solid var(--magtxt,var(--mag));}
#lj-freecard .stop-badge.free{color:var(--green);border:1.5px solid var(--green);}
html[data-theme="dark"] #lj-freecard .stop-badge.free{color:#6fcf9c;border-color:#6fcf9c;}
#lj-freecard .stop-sub{display:block;margin:0 0 6px;font:800 12px/1.3 "Avenir Next",Arial;letter-spacing:1.4px;text-transform:uppercase;color:var(--turq);}
#lj-freecard h3{font:800 19px/1.24 "Avenir Next",Arial;color:var(--head);margin:0 0 7px;letter-spacing:-.3px;}
#lj-freecard p{margin:0 0 14px;font-size:13.8px;color:var(--mut);line-height:1.5;font-weight:500;}
#lj-freecard .stop-cta{display:table;margin:4px auto 0;text-align:center;font:800 12.5px/1 "Avenir Next",Arial;padding:11px 18px;border-radius:10px;letter-spacing:.2px;color:#fff;transition:transform .22s cubic-bezier(.2,.75,.25,1),box-shadow .22s ease,filter .15s;}
#lj-freecard .stop-cta:hover{transform:translateY(-3px) scale(1.04);}
#lj-freecard .stop-cta.free{background:linear-gradient(135deg,#245F46,#0F3324);box-shadow:0 8px 18px rgba(27,77,54,.28);}
@media (max-width:420px){#lj-freecard .stop{padding:20px 18px;}#lj-freecard h3{font-size:18px;}}
#lj-freecard .stop{border-top-color:var(--green);}
#lj-freecard .thumb{width:84px;height:84px;border-radius:16px;background:linear-gradient(150deg,#3A9A9A,#1F5E5E);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 8px 18px rgba(15,76,76,.25);}
#lj-freecard .thumb b{display:block;font:800 19px/1 "Avenir Next",Arial;letter-spacing:1.5px;}
#lj-freecard .thumb small{display:block;font:800 10.5px/1.15 "Avenir Next",Arial;letter-spacing:1.2px;margin-top:5px;}
#lj-freecard .mock{margin:0 0 18px;animation:ljfFloat 5.5s ease-in-out infinite;}
#lj-freecard .mock img{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 16px 34px rgba(10,20,25,.16);}
@keyframes ljfFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@media (prefers-reduced-motion:reduce){#lj-freecard .mock{animation:none;}}
#lj-freecard .price{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;}
#lj-freecard .now{font:800 30px/1 "Avenir Next",Arial;color:var(--head);letter-spacing:-.5px;}
#lj-freecard .note{font:700 12px/1.2 "Avenir Next",Arial;color:var(--mut);}
</style>
<div class="stop">
  <div class="mock"><img src="PASTE-TRUST-IMAGE-URL" alt="The TRUST Sheet on a laptop: what you keep every month and where your money goes" width="1518" height="935"></div>
  <div class="stop-top"><div class="thumb"><b>TRUST</b><small>FREE<br>SHEET</small></div><span class="stop-badge free">Free</span></div>
  <span class="stop-sub">Start free</span>
  <h3>TRUST Sheet &#8211; Financial Tracker</h3>
  <p>You work hard for your money. Know where it goes, and how much you actually keep.</p>
  <div class="price"><span class="now">&#8364;0</span><span class="note">Google Sheets &amp; Excel</span></div>
  <a class="stop-cta free" href="https://www.cybercnslt.com/free-financial-trust-sheet">Get the free sheet</a>
</div>
</div>
