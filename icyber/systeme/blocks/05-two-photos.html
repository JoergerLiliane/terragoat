<!-- iCyber · Your two photos (cabin + cybersecurity) · paste into a systeme.io "Custom HTML/CSS/JS" element -->
<div id="lj-photos">
<style>
#lj-photos{--bg:#EDF3F2;--card:#ffffff;--cardbd:#E3ECEB;--ink:#3c4f50;--head:#0F4C4C;--mut:#64777a;--turq:#1A9E9E;--turqbr:#35B7B7;--green:#1B4D36;--mag:#8E1F45;--magdk:#5E1530;--soft:#F6F9F9;--hl:#F7E6EE;
  font-family:"Avenir Next","Segoe UI","Helvetica Neue",-apple-system,Arial,sans-serif;-webkit-font-smoothing:antialiased;
  max-width:760px;margin:0 auto;padding:0 2px;color:var(--ink);line-height:1.5;text-align:left;}
html[data-theme="dark"] #lj-photos{--bg:#0e1621;--card:#16202c;--cardbd:#273543;--ink:#c6d5d5;--head:#ffffff;--mut:#93a6a6;--soft:#1c2836;--hl:#2a1d27;--magtxt:#E0577F;}
#lj-photos *,#lj-photos *::before,#lj-photos *::after{box-sizing:border-box;margin:0;padding:0;border:0;background:none;box-shadow:none;text-shadow:none;letter-spacing:normal;text-transform:none;list-style:none;}
#lj-photos a{text-decoration:none;}
#lj-photos .row{display:flex;justify-content:center;align-items:flex-start;gap:clamp(18px,6vw,56px);flex-wrap:wrap;}
#lj-photos figure{margin:0;text-align:center;width:min(220px,40vw);}
#lj-photos .ering{display:block;border-radius:50%;padding:6px;background:linear-gradient(160deg,#8E1F45 0%,#5E1530 45%,#1A9E9E 100%);box-shadow:0 18px 44px rgba(0,0,0,.25);}
#lj-photos .ecirc{display:block;width:100%;aspect-ratio:1/1;height:auto;object-fit:cover;border-radius:50%;border:4px solid #fff;background:#0c1119;}
#lj-photos figcaption{margin-top:12px;font:800 11.5px/1.3 "Avenir Next",Arial;letter-spacing:1.4px;text-transform:uppercase;color:var(--turq);}
#lj-photos figcaption span{display:block;margin-top:3px;font-weight:600;letter-spacing:.2px;text-transform:none;font-size:13px;color:var(--mut);}
#lj-photos .cap{margin:18px 0 0;text-align:center;font:600 14px/1.5 "Avenir Next",Arial;color:var(--mut);font-style:italic;}
</style>
<div class="row">
  <figure><span class="ering"><img class="ecirc" src="PASTE-CABIN-PHOTO-URL" alt="Liliane as a flight attendant"></span><figcaption>Then<span>Flight attendant</span></figcaption></figure>
  <figure><span class="ering"><img class="ecirc" src="PASTE-CYBER-PHOTO-URL" alt="Liliane as a cybersecurity consultant"></span><figcaption>Now<span>Cybersecurity, financial sector</span></figcaption></figure>
</div>
<p class="cap">From the cabin to cybersecurity in the financial sector</p>
</div>
