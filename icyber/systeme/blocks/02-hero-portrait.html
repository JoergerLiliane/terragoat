<style>
#lj-hero{--bg:#EDF3F2;--card:#ffffff;--cardbd:#E3ECEB;--ink:#3c4f50;--head:#0F4C4C;--mut:#64777a;--turq:#1A9E9E;--turqbr:#35B7B7;--green:#1B4D36;--mag:#8E1F45;--magdk:#5E1530;--soft:#F6F9F9;--hl:#F7E6EE;

html[data-theme="dark"] #lj-hero{--bg:#0e1621;--card:#16202c;--cardbd:#273543;--ink:#c6d5d5;--head:#ffffff;--mut:#93a6a6;--soft:#1c2836;--hl:#2a1d27;--magtxt:#E0577F;}
#lj-hero *,#lj-hero *::before,#lj-hero *::after{box-sizing:border-box;margin:0;padding:0;border:0;background:none;box-shadow:none;text-shadow:none;letter-spacing:normal;text-transform:none;list-style:none;}
#lj-hero a{text-decoration:none;}
#lj-hero{container-type:inline-size;width:100%;box-sizing:border-box;}
#lj-hero{text-align:center;padding:44px 16px 10px;}
#lj-hero .ey{display:block;font:800 13px/1 "Avenir Next",Arial;letter-spacing:3px;text-transform:uppercase;color:var(--turq);margin-bottom:18px;}
html[data-theme="dark"] #lj-hero .ey{color:#35B7B7;}
#lj-hero h1{font:800 52px/1.02 "Avenir Next",Arial;letter-spacing:-1px;color:var(--head);margin:0;}
#lj-hero h1 .acc{color:var(--acc,#E6117F);}
html[data-theme="dark"] #lj-hero h1 .acc{color:#ff62ad;}
#lj-hero .sub{max-width:580px;margin:12px auto 0;color:var(--mut);font-size:16.5px;line-height:1.5;font-weight:500;}
html[data-theme="dark"] #lj-hero .sub{color:#cfe0df;}
#lj-hero .sub b{color:var(--head);font-weight:800;}
#lj-hero .eternity{display:flex;justify-content:center;align-items:center;margin:22px 0 0;perspective:1100px;}
#lj-hero .ering{display:block;border-radius:50%;padding:7px;background:linear-gradient(160deg,#8E1F45 0%,#5E1530 45%,#1A9E9E 100%);box-shadow:0 18px 44px rgba(0,0,0,.35);
  animation:ljhSpin 1.15s cubic-bezier(.3,.7,.3,1) both,ljhFloat 5.5s ease-in-out 1.3s infinite;}
#lj-hero .ecirc{display:block;width:190px;height:190px;object-fit:cover;border-radius:50%;border:6px solid #fff;background:#0c1119;}
#lj-hero .by{margin-top:16px;font:700 14px/1.5 "Avenir Next",Arial;color:var(--turq);}
html[data-theme="dark"] #lj-hero .by{color:#9fd0d0;}
#lj-hero .by-n{display:block;font-size:17px;font-weight:800;}
#lj-hero .by-t{display:block;font-size:14px;font-weight:600;margin-top:2px;}
#lj-hero h1,#lj-hero .sub,#lj-hero .eternity,#lj-hero .by{animation:ljhUp .85s both;}
#lj-hero .sub{animation-delay:.12s;}#lj-hero .eternity{animation-delay:.24s;}#lj-hero .by{animation-delay:.38s;}
@keyframes ljhSpin{from{transform:rotateY(0deg);}to{transform:rotateY(360deg);}}
@keyframes ljhFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
@keyframes ljhUp{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){#lj-hero *{animation:none !important;}}
@container (max-width:600px){#lj-hero h1{font-size:27px;letter-spacing:-.4px;}#lj-hero .sub{font-size:13.5px;}#lj-hero .ey{font-size:11px;margin-bottom:12px;}#lj-hero .ecirc{width:160px;height:160px;}}
