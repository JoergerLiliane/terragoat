<div id="lj-photos">
<style>
#lj-photos{--bg:#EDF3F2;--card:#ffffff;--cardbd:#E3ECEB;--ink:#3c4f50;--head:#0F4C4C;--mut:#64777a;--turq:#1A9E9E;--turqbr:#35B7B7;--green:#1B4D36;--mag:#8E1F45;--magdk:#5E1530;--soft:#F6F9F9;--hl:#F7E6EE;
  font-family:"Avenir Next","Segoe UI","Helvetica Neue",-apple-system,Arial,sans-serif;-webkit-font-smoothing:antialiased;
  max-width:760px;margin:0 auto;padding:0 2px;color:var(--ink);line-height:1.5;text-align:left;}
html[data-theme="dark"] #lj-photos{--bg:#0e1621;--card:#16202c;--cardbd:#273543;--ink:#c6d5d5;--head:#ffffff;--mut:#93a6a6;--soft:#1c2836;--hl:#2a1d27;--magtxt:#E0577F;}
#lj-photos *,#lj-photos *::before,#lj-photos *::after{box-sizing:border-box;margin:0;padding:0;border:0;background:none;box-shadow:none;text-shadow:none;letter-spacing:normal;text-transform:none;list-style:none;}
#lj-photos a{text-decoration:none;}
#lj-photos img{display:block;width:100%;height:auto;margin:0 auto;}
#lj-photos .tn{position:relative;height:44px;margin-top:2px;}
#lj-photos .tn span{position:absolute;top:0;transform:translateX(-50%);text-align:center;white-space:nowrap;font:800 12px/1.3 "Avenir Next",Arial;letter-spacing:1.6px;text-transform:uppercase;color:var(--turq);}
html[data-theme="dark"] #lj-photos .tn span{color:#35B7B7;}
#lj-photos .tn span:first-child{left:27%;}#lj-photos .tn span:last-child{left:73.5%;}
#lj-photos .tn small{display:block;margin-top:3px;font:600 13px/1.3 "Avenir Next",Arial;letter-spacing:.2px;text-transform:none;color:var(--mut);}
@media (max-width:480px){#lj-photos .tn{height:40px;}#lj-photos .tn small{font-size:11.5px;}#lj-photos .tn span{font-size:11.5px;}}
#lj-photos .cap{margin:14px 0 0;text-align:center;font:600 14px/1.5 "Avenir Next",Arial;color:var(--mut);font-style:italic;}
</style>
